name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and publish
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mlquantx
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}

      - name: Check package version matches release tag
        id: publish_check
        shell: bash
        run: |
          version="$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          release_tag="${{ github.event.release.tag_name }}"
          expected_tag="v${version}"

          if [[ "${{ github.event_name }}" == "release" && "${release_tag}" != "${expected_tag}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PyPI publish: release tag ${release_tag} does not match package version ${expected_tag}."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.publish_check.outputs.publish == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        if: steps.publish_check.outputs.publish == 'true'
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        if: steps.publish_check.outputs.publish == 'true'
        run: python -m build

      - name: Check distributions
        if: steps.publish_check.outputs.publish == 'true'
        run: python -m twine check --strict dist/*

      - name: Publish distributions to PyPI
        if: steps.publish_check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
